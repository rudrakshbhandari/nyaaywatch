services:
  postgres:
    image: postgres:16-alpine
    container_name: nyaaywatch-postgres
    environment:
      POSTGRES_DB: nyaaywatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyaaywatch"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - nyaaywatch-postgres:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.8.1
    container_name: nyaaywatch-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-south-1
      DEBUG: "0"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  nyaaywatch-postgres:
  localstack-data:
