# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Parliamentary Activity Snapshot + Individual MP Profiles"
  slug: "parliament-activity-mp-profiles"
  kind: specific
  tranche: "Build and locally demonstrate the first internal Lok Sabha legislative vertical from bounded official-source fixtures."
  status: done
  oracle:
    signal: "A deterministic local fixture replay produces one published Lok Sabha activity snapshot and one time-bounded MP profile with matching HTML/JSON values and replay/rollback evidence."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed local end-to-end demo, source-linked methodology, parity tests, replay evidence, rollback evidence, and PR record of remaining public-beta gates."
  intake:
    original_request: "Build and locally run NyaayWatch's first non-judicial vertical milestone: Parliamentary Activity Snapshot + Individual MP Profiles."
    interpreted_outcome: "Create a narrow, internal-only, evidence-first Lok Sabha bills-and-questions vertical with at least one official-record MP profile and reusable snapshot/replay/rollback lineage."
    input_shape: specific
    audience: "NyaayWatch operators and reviewers; internal users only until source, legal, methodology, and publication gates pass."
    authority: requested
    proof_type: demo
    completion_proof: "Local fetch/extract/normalize/publish/replay/rollback works from captured fixtures; at least one MP profile is time-bounded and source-linked; aggregate/profile lineage matches; HTML and JSON parity tests pass; tests pass; PR records remaining blockers."
    likely_misfire: "Shipping a generic politician dashboard, rankings, or unsupported activity/performance judgments instead of a bounded Lok Sabha snapshot and evidence-linked MP profile."
    blind_spots_considered:
      - "Digital Sansad and Parliament Digital Library source review, timestamps, pagination, session boundaries, identity completeness, and redistribution terms must be resolved before publication scope expands."
      - "Official links and normalized aggregates are safer than redistributing raw parliamentary PDFs or bulk search results."
      - "Role, House, term, and session boundaries must be explicit before comparing activity."
      - "Attendance remains missing unless the official source defines it clearly."
      - "Published values must have shared lineage across aggregate and MP surfaces."
    existing_plan_facts:
      - "Required phases are source review, bounded fixture capture, typed schemas, deterministic extraction/normalization, internal operator flow, aggregate/profile surfaces, tests, and local end-to-end evidence."
      - "Hard scope is Lok Sabha only; bills and parliamentary questions first; judiciary behavior and existing tests must remain intact."
      - "Do not build Rajya Sabha, state legislatures, executive-branch data, rankings, composite scores, or competence/ideology/corruption/popularity/policy-quality inference."
      - "Keep the pilot internal until source, legal, methodology, and publication gates pass."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/parliament-activity-mp-profiles/"
    command: "node <skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/parliament-activity-mp-profiles"

