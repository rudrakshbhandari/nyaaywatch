name: Azure Preview Reconcile

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    if: vars.ENABLE_AZURE_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: nyaaywatch-previews
      AZURE_CONTAINER_REGISTRY: nyaaywatchpreview
    steps:
      - name: Log in to Azure using the preview-only identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Compute open pull request numbers
        id: open-prs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            core.setOutput("numbers", pulls.map((pull) => pull.number).join(" "));
      - name: Remove preview apps for closed pull requests
        env:
          OPEN_PR_NUMBERS: ${{ steps.open-prs.outputs.numbers }}
        run: |
          set -euo pipefail
          apps="$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" --query '[].name' --output tsv)"
          for app in $apps; do
            case "$app" in
              nyaaywatch-pr-*)
                number="${app#nyaaywatch-pr-}"
                if ! printf ' %s ' "$OPEN_PR_NUMBERS" | grep -q " $number "; then
                  az containerapp delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" --yes
                fi
                ;;
            esac
          done
      - name: Retry deletion of registry images for closed pull requests
        env:
          OPEN_PR_NUMBERS: ${{ steps.open-prs.outputs.numbers }}
        run: |
          set -euo pipefail
          repositories="$(az acr repository list --name "$AZURE_CONTAINER_REGISTRY" --output tsv)"
          if ! printf '%s\n' "$repositories" | grep -Fxq nyaaywatch; then
            exit 0
          fi
          tags="$(az acr repository show-tags --name "$AZURE_CONTAINER_REGISTRY" --repository nyaaywatch --output tsv)"
          for tag in $tags; do
            case "$tag" in
              pr-[0-9]*-*)
                number="${tag#pr-}"
                number="${number%%-*}"
                case "$number" in
                  ''|*[!0-9]*) continue ;;
                esac
                if ! printf ' %s ' "$OPEN_PR_NUMBERS" | grep -q " $number "; then
                  az acr repository delete --name "$AZURE_CONTAINER_REGISTRY" --image "nyaaywatch:$tag" --yes
                fi
                ;;
            esac
          done
