name: Azure Preview Deploy

on:
  workflow_run:
    workflows: [Azure Preview Build]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && vars.ENABLE_AZURE_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: azure-preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    env:
      AZURE_RESOURCE_GROUP: nyaaywatch-previews
      AZURE_CONTAINER_APP_ENVIRONMENT: nyaaywatch-previews-apps
      AZURE_CONTAINER_REGISTRY: nyaaywatchpreview
    steps:
      - name: Validate source workflow and pull request
        id: validate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.SOURCE_RUN_ID),
            });
            if (run.data.event !== "pull_request" || run.data.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Preview source must be a same-repository pull_request run.");
              return;
            }
            const pull = run.data.pull_requests?.[0];
            if (!pull?.number) {
              core.setFailed("Source run is not associated with a pull request.");
              return;
            }
            const current = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pull.number });
            if (current.data.state !== "open" || current.data.head.sha !== pull.head.sha || current.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed("Pull request is closed, changed, or from a fork; refusing deployment.");
              return;
            }
            core.setOutput("number", String(pull.number));
            core.setOutput("sha", current.data.head.sha);
      - name: Download image artifact from build run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview
      - name: Load built image
        run: gzip -dc "$RUNNER_TEMP/preview/preview-image.tar.gz" | docker load
      - name: Log in to Azure using the preview-only identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push image to preview registry
        env:
          IMAGE_TAG: pr-${{ steps.validate.outputs.number }}-${{ steps.validate.outputs.sha }}
        run: |
          az acr login --name "$AZURE_CONTAINER_REGISTRY"
          docker tag nyaaywatch-preview:artifact "$AZURE_CONTAINER_REGISTRY.azurecr.io/nyaaywatch:$IMAGE_TAG"
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/nyaaywatch:$IMAGE_TAG"
      - name: Deploy fixture-only Container App
        id: deploy
        env:
          IMAGE_TAG: pr-${{ steps.validate.outputs.number }}-${{ steps.validate.outputs.sha }}
        run: |
          app="nyaaywatch-pr-${{ steps.validate.outputs.number }}"
          image="$AZURE_CONTAINER_REGISTRY.azurecr.io/nyaaywatch:$IMAGE_TAG"
          pull_identity="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name nyaaywatch-preview-pull --query id --output tsv)"
          if az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" >/dev/null 2>&1; then
            az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" --image "$image" --set-env-vars APP_MODE=preview PORT=3000
          else
            az containerapp create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app" \
              --environment "$AZURE_CONTAINER_APP_ENVIRONMENT" \
              --image "$image" \
              --user-assigned "$pull_identity" \
              --registry-server "$AZURE_CONTAINER_REGISTRY.azurecr.io" \
              --registry-identity "$pull_identity" \
              --ingress external --target-port 3000 \
              --min-replicas 0 --max-replicas 1 \
              --cpu 0.25 --memory 0.5Gi \
              --env-vars APP_MODE=preview PORT=3000
          fi
          fqdn="$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" --query properties.configuration.ingress.fqdn --output tsv)"
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
          old_tags="$(az acr repository show-tags --name "$AZURE_CONTAINER_REGISTRY" --repository nyaaywatch --query "[?starts_with(@, 'pr-${{ steps.validate.outputs.number }}-') && @ != '$IMAGE_TAG']" --output tsv)"
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] || az acr repository delete --name "$AZURE_CONTAINER_REGISTRY" --image "nyaaywatch:$old_tag" --yes
          done <<< "$old_tags"
      - name: Comment preview URL
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ steps.validate.outputs.number }}
        with:
          script: |
            const marker = "<!-- nyaaywatch-preview -->";
            const body = `${marker}\nPreview ready: ${process.env.PREVIEW_URL}\n\nFixture-backed public web preview. No production database or secrets are connected.`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100 });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER), body });
