name: NJDG Missing Zero Outreach

on:
  schedule:
    # 10:00 AM Asia/Kolkata on Monday, Wednesday, and Friday.
    - cron: "30 4 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: njdg-missing-zero-outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: https://nyaaywatch.in
      AZURE_STORAGE_ACCOUNT_URL: https://nyaaywatchproduction.blob.core.windows.net
      AZURE_STORAGE_CONTAINER: artifacts
      AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
      AZURE_EMAIL_SENDER: ${{ vars.AZURE_EMAIL_SENDER }}
      NJDG_OUTREACH_TO: ${{ secrets.NJDG_OUTREACH_TO }}
      NJDG_OUTREACH_REPLY_TO: ${{ secrets.NJDG_OUTREACH_REPLY_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Log in to Azure
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Send cadence-limited NJDG outreach when missing monthly movement persists
        id: outreach
        continue-on-error: true
        run: |
          set +e
          npm run --silent ops:njdg-missing-zero-outreach -- \
            --base-url="$PUBLIC_BASE_URL" \
            --send 2>&1 | tee njdg-outreach-output.log
          status="${PIPESTATUS[0]}"
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Sync NJDG outreach issue
        if: always()
        id: sync_issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          OUTREACH_OUTCOME: ${{ steps.outreach.outcome }}
          OUTREACH_EXIT_CODE: ${{ steps.outreach.outputs.exit-code }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- nyaaywatch-njdg-outreach -->";
            const title = "NJDG outreach failure";
            const failed = process.env.OUTREACH_OUTCOME !== "success";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              marker,
              `Updated: ${new Date().toISOString()}`,
              `Workflow run: ${runUrl}`,
              "",
              failed
                ? "The scheduled NJDG missing-zero outreach workflow is failing. Email delivery or evidence archival may have failed."
                : "The scheduled NJDG missing-zero outreach workflow is green.",
              "",
              "## Check",
              `- Outreach send: ${process.env.OUTREACH_OUTCOME}`,
              `- Exit code: ${process.env.OUTREACH_EXIT_CODE || "unknown"}`,
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title || issue.body?.includes(marker));
            let action = "noop";
            let issueNumber = existing?.number ?? "";

            if (failed) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
                action = "updated";
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
                action = "created";
                issueNumber = String(created.data.number);
              }
            } else if (existing) {
              action = "recovery-pending";
              issueNumber = String(existing.number);
            }

            core.setOutput("action", action);
            core.setOutput("issue-number", issueNumber);

      - name: Close recovered NJDG outreach issue
        if: always() && steps.sync_issue.outputs.action == 'recovery-pending' && steps.outreach.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = Number("${{ steps.sync_issue.outputs.issue-number }}");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `NJDG outreach recovered at ${new Date().toISOString()}.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: "closed",
            });

      - name: Fail when NJDG outreach failed
        if: always()
        env:
          OUTREACH_OUTCOME: ${{ steps.outreach.outcome }}
        run: |
          if [[ "$OUTREACH_OUTCOME" != "success" ]]; then
            exit 1
          fi
