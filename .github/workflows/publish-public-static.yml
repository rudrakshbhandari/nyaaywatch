name: Publish public static snapshot

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin whose reviewed public snapshot should be exported"
        required: false
        default: "https://nyaaywatch.in"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: publish-public-static
  cancel-in-progress: false

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: ${{ inputs.base_url || vars.PUBLIC_BASE_URL || 'https://nyaaywatch.in' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nyaaywatch-public' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export reviewed public snapshot
        run: npm run export:public -- --base-url "$PUBLIC_BASE_URL" --output-dir dist-public --max-pages 15000

      - name: Verify static export boundary
        run: npm run verify:public-export -- dist-public

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.33.0 pages deploy dist-public --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch migration
