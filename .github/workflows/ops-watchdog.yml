name: Ops Watchdog

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: ops-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      ACTIVE_PRODUCTION_PROVIDER: ${{ vars.ACTIVE_PRODUCTION_PROVIDER || 'aws' }}
      AWS_REGION: ap-south-1
      RUNTIME_REGION: ${{ vars.ACTIVE_PRODUCTION_PROVIDER == 'azure' && 'centralindia' || 'ap-south-1' }}
      PUBLIC_BASE_URL: https://nyaaywatch.in
      PRODUCTION_STACK_NAME: nyaaywatch-production
      OPERATOR_API_TOKEN: ${{ secrets.AZURE_OPERATOR_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        if: env.ACTIVE_PRODUCTION_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::723951822728:role/nyaaywatch-github-deploy-role

      - name: Load live operator token and alarm topic
        if: env.ACTIVE_PRODUCTION_PROVIDER == 'aws'
        run: |
          operator_token_secret_arn="$(
            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$PRODUCTION_STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='OperatorApiTokenSecretArn'].OutputValue | [0]" \
              --output text
          )"
          alarm_topic_arn="$(
            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$PRODUCTION_STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='AlarmTopicArn'].OutputValue | [0]" \
              --output text
          )"
          operator_token="$(
            aws secretsmanager get-secret-value \
              --region "$AWS_REGION" \
              --secret-id "$operator_token_secret_arn" \
              --query SecretString \
              --output text
          )"
          echo "::add-mask::$operator_token"
          echo "OPERATOR_API_TOKEN=$operator_token" >> "$GITHUB_ENV"
          echo "ALARM_TOPIC_ARN=$alarm_topic_arn" >> "$GITHUB_ENV"

      - name: Run public alpha ops sweep
        id: public_alpha
        continue-on-error: true
        run: |
          set +e
          npm run --silent ops:verify-public-alpha -- --base-url="$PUBLIC_BASE_URL" > public-alpha-summary.json
          status=$?
          [[ -f public-alpha-summary.json ]] && cat public-alpha-summary.json
          exit "$status"

      - name: Run internal fetch schedule watchdog
        id: internal_fetch
        if: env.ACTIVE_PRODUCTION_PROVIDER == 'aws'
        continue-on-error: true
        run: |
          set +e
          npm run --silent ops:verify-internal-fetch-schedule -- \
            --base-url="$PUBLIC_BASE_URL" \
            --stack-name="$PRODUCTION_STACK_NAME" \
            > internal-fetch-schedule-summary.json
          status=$?
          [[ -f internal-fetch-schedule-summary.json ]] && cat internal-fetch-schedule-summary.json
          exit "$status"

      - name: Log in to Azure for the production watchdog
        if: env.ACTIVE_PRODUCTION_PROVIDER == 'azure'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure scheduled jobs
        id: azure_jobs
        if: env.ACTIVE_PRODUCTION_PROVIDER == 'azure'
        continue-on-error: true
        run: |
          set -euo pipefail
          resource_group="nyaaywatch-production"
          app_prefix="nyaaywatch-production"
          jobs=(fetch sc-fetch hc-fetch publish alpha-ops)
          failures=()
          tier_json='[]'
          for job_suffix in "${jobs[@]}"; do
            job_name="${app_prefix}-${job_suffix}"
            max_age_minutes=1560
            [[ "$job_suffix" == "alpha-ops" ]] && max_age_minutes=120
            job_json="$(az containerapp job show --name "$job_name" --resource-group "$resource_group" --output json)"
            execution_json="$(az containerapp job execution list --name "$job_name" --resource-group "$resource_group" --output json)"
            validation="$(JOB_NAME="$job_name" MAX_AGE_MINUTES="$max_age_minutes" JOB_JSON="$job_json" EXECUTION_JSON="$execution_json" node - <<'NODE'
          const job = JSON.parse(process.env.JOB_JSON);
          const executions = JSON.parse(process.env.EXECUTION_JSON);
          const config = job.properties?.configuration ?? {};
          const latest = executions
            .slice()
            .sort((a, b) => Date.parse(b.properties?.startTime ?? 0) - Date.parse(a.properties?.startTime ?? 0))[0];
          const completed = executions
            .filter((execution) => !new Set(["Running", "Scheduled", "Starting"]).has(execution.properties?.status))
            .sort((a, b) => Date.parse(b.properties?.endTime ?? b.properties?.startTime ?? 0) - Date.parse(a.properties?.endTime ?? a.properties?.startTime ?? 0))[0];
          const failures = [];
          if (job.properties?.provisioningState !== "Succeeded") failures.push("provisioning is not Succeeded");
          if (config.triggerType !== "Schedule") failures.push("trigger is not Schedule");
          if (!config.scheduleTriggerConfig?.cronExpression) failures.push("cron expression is missing");
          if (!completed) {
            failures.push("no completed execution has been recorded");
          } else {
            const completedAt = completed.properties?.endTime ?? completed.properties?.startTime;
            const ageMinutes = (Date.now() - Date.parse(completedAt ?? 0)) / 60000;
            const status = completed.properties?.status;
            if (status !== "Succeeded") failures.push(`latest completed execution status is ${status ?? "unknown"}`);
            if (!Number.isFinite(ageMinutes) || ageMinutes > Number(process.env.MAX_AGE_MINUTES)) {
              failures.push(`latest completed execution is ${Math.round(ageMinutes)} minutes old`);
            }
          }
          process.stdout.write(JSON.stringify({
            tier: process.env.JOB_NAME,
            scheduleName: process.env.JOB_NAME,
            scheduleState: "ENABLED",
            scheduleExpression: config.scheduleTriggerConfig?.cronExpression ?? null,
            scheduleExpressionTimezone: "UTC",
            latestScheduledRunId: completed?.name ?? null,
            latestScheduledRunStatus: completed?.properties?.status ?? null,
            latestScheduledRunFreshnessMinutes: completed ? Math.round((Date.now() - Date.parse(completed.properties?.endTime ?? completed.properties?.startTime)) / 60000) : null,
            currentScheduledRunId: latest?.name ?? null,
            currentScheduledRunStatus: latest?.properties?.status ?? null,
            schedulerTargetMatchesService: true,
            usesScheduledFetchEntrypoint: true,
            failures,
          }));
          NODE
            )"
            tier_json="$(node -e 'const all=JSON.parse(process.argv[1]); all.push(JSON.parse(process.argv[2])); process.stdout.write(JSON.stringify(all))' "$tier_json" "$validation")"
            if [[ "$(printf '%s' "$validation" | node -e 'let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>process.stdout.write(JSON.parse(d).failures.length ? "1" : "0"))')" == "1" ]]; then
              while IFS= read -r failure; do failures+=("$job_name: $failure"); done < <(printf '%s' "$validation" | node -e 'let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>JSON.parse(d).failures.forEach(f=>console.log(f)))')
            fi
          done
          TIER_JSON="$tier_json" FAILURES="$(printf '%s\n' "${failures[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" node - <<'NODE'
          const fs = require("node:fs");
          const tiers = JSON.parse(process.env.TIER_JSON).map(({ failures, ...tier }) => ({ ...tier, failing: failures.length > 0 }));
          const failures = JSON.parse(process.env.FAILURES);
          fs.writeFileSync("internal-fetch-schedule-summary.json", JSON.stringify({
            provider: "azure",
            tiers,
            failingTiers: tiers.filter((tier) => tier.failing).map((tier) => tier.tier),
          }, null, 2));
          NODE
          if ((${#failures[@]} > 0)); then
            printf '%s\n' "${failures[@]}" >&2
            exit 1
          fi

      - name: Compose watchdog alert
        if: always()
        env:
          PUBLIC_ALPHA_OUTCOME: ${{ steps.public_alpha.outcome }}
          INTERNAL_FETCH_OUTCOME: ${{ env.ACTIVE_PRODUCTION_PROVIDER == 'azure' && steps.azure_jobs.outcome || steps.internal_fetch.outcome }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const publicOutcome = process.env.PUBLIC_ALPHA_OUTCOME ?? "failure";
          const internalFetchOutcome = process.env.INTERNAL_FETCH_OUTCOME ?? "failure";
          const failed = publicOutcome !== "success" || internalFetchOutcome !== "success";
          const publicSummary = fs.existsSync("public-alpha-summary.json")
            ? JSON.parse(fs.readFileSync("public-alpha-summary.json", "utf8"))
            : null;
          const scheduleSummary = fs.existsSync("internal-fetch-schedule-summary.json")
            ? JSON.parse(fs.readFileSync("internal-fetch-schedule-summary.json", "utf8"))
            : null;

          const marker = "<!-- nyaaywatch-ops-watchdog -->";
          const lines = [
            marker,
            `Updated: ${new Date().toISOString()}`,
            `Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            "",
            failed ? "The scheduled ops watchdog is failing." : "The scheduled ops watchdog is green.",
            "",
            "## Checks",
            `- Public alpha sweep: ${publicOutcome}`,
            `- Internal fetch schedule watchdog: ${internalFetchOutcome}`,
            "",
          ];

          if (publicSummary) {
            lines.push("## Public Alpha Sweep");
            lines.push(`- Healthy states: ${publicSummary.healthyStates.length}/${publicSummary.totalStates}`);
            lines.push(`- Stale states: ${publicSummary.staleStates.length ? publicSummary.staleStates.join(", ") : "none"}`);
            lines.push(
              `- Daily fetch lag states: ${publicSummary.dailyFetchLagStates.length ? publicSummary.dailyFetchLagStates.join(", ") : "none"}`,
            );
            lines.push(
              `- Verification failures: ${publicSummary.failingStates.length ? publicSummary.failingStates.join(", ") : "none"}`,
            );
            lines.push("");
          }

          if (scheduleSummary) {
            lines.push("## Internal Fetch Schedules");
            lines.push(`- Failing tiers: ${scheduleSummary.failingTiers.length ? scheduleSummary.failingTiers.join(", ") : "none"}`);
            for (const tier of scheduleSummary.tiers) {
              lines.push(`### ${tier.tier}`);
              lines.push(`- Schedule: ${tier.scheduleName}`);
              lines.push(`- State: ${tier.scheduleState ?? "unknown"}`);
              lines.push(`- Expression: ${tier.scheduleExpression ?? "unknown"} (${tier.scheduleExpressionTimezone ?? "unknown"})`);
              lines.push(`- Live task definition: ${tier.liveTaskDefinitionArn ?? "unknown"}`);
              lines.push(`- Schedule target task definition: ${tier.scheduleTaskDefinitionArn ?? "unknown"}`);
              lines.push(`- Target matches service: ${tier.schedulerTargetMatchesService ? "yes" : "no"}`);
              lines.push(`- Uses scheduled fetch entrypoint: ${tier.usesScheduledFetchEntrypoint ? "yes" : "no"}`);
              lines.push(`- Latest scheduled run: ${tier.latestScheduledRunId ?? "none"} (${tier.latestScheduledRunStatus ?? "unknown"})`);
              lines.push(`- Latest scheduled freshness: ${tier.latestScheduledRunFreshnessMinutes ?? "unknown"} minute(s)`);
              lines.push(`- Latest scheduled note: ${tier.latestScheduledRunNote ?? "none"}`);
              lines.push("");
            }
          }

          fs.writeFileSync("watchdog-alert.md", `${lines.join("\n")}\n`);

          const snsLines = [
            failed ? "NyaayWatch ops watchdog failed." : "NyaayWatch ops watchdog recovered.",
            `Public alpha sweep: ${publicOutcome}`,
            `Internal fetch schedule watchdog: ${internalFetchOutcome}`,
          ];

          if (publicSummary?.staleStates?.length) {
            snsLines.push(`Stale states: ${publicSummary.staleStates.join(", ")}`);
          }
          if (publicSummary?.dailyFetchLagStates?.length) {
            snsLines.push(`Daily fetch lag states: ${publicSummary.dailyFetchLagStates.join(", ")}`);
          }
          if (scheduleSummary?.failingTiers?.length) {
            snsLines.push(`Failing tiers: ${scheduleSummary.failingTiers.join(", ")}`);
          }

          fs.writeFileSync("watchdog-alert.txt", `${snsLines.join("\n")}\n`);
          NODE

      - name: Sync watchdog issue
        if: always()
        id: sync_issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PUBLIC_ALPHA_OUTCOME: ${{ steps.public_alpha.outcome }}
          INTERNAL_FETCH_OUTCOME: ${{ env.ACTIVE_PRODUCTION_PROVIDER == 'azure' && steps.azure_jobs.outcome || steps.internal_fetch.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const marker = "<!-- nyaaywatch-ops-watchdog -->";
            const title = "Ops watchdog failure";
            const failed = process.env.PUBLIC_ALPHA_OUTCOME !== "success" || process.env.INTERNAL_FETCH_OUTCOME !== "success";
            const body = fs.readFileSync("watchdog-alert.md", "utf8");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title || issue.body?.includes(marker));
            let action = "noop";
            let issueNumber = existing?.number ?? "";

            if (failed) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
                action = "updated";
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
                action = "created";
                issueNumber = String(created.data.number);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Watchdog recovered at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
              action = "closed";
              issueNumber = String(existing.number);
            }

            core.setOutput("action", action);
            core.setOutput("issue-number", issueNumber);

      - name: Publish SNS alert while watchdog issue is open or on recovery
        if: always() && env.ACTIVE_PRODUCTION_PROVIDER == 'aws' && env.ALARM_TOPIC_ARN != '' && (steps.sync_issue.outputs.action == 'created' || steps.sync_issue.outputs.action == 'updated' || steps.sync_issue.outputs.action == 'closed')
        env:
          ACTION: ${{ steps.sync_issue.outputs.action }}
        run: |
          if [[ "$ACTION" == "closed" ]]; then
            subject="NyaayWatch ops watchdog recovered"
          else
            subject="NyaayWatch ops watchdog failure"
          fi
          aws sns publish \
            --region "$AWS_REGION" \
            --topic-arn "$ALARM_TOPIC_ARN" \
            --subject "$subject" \
            --message file://watchdog-alert.txt

      - name: Fail when any watchdog check failed
        if: always()
        env:
          PUBLIC_ALPHA_OUTCOME: ${{ steps.public_alpha.outcome }}
          INTERNAL_FETCH_OUTCOME: ${{ env.ACTIVE_PRODUCTION_PROVIDER == 'azure' && steps.azure_jobs.outcome || steps.internal_fetch.outcome }}
        run: |
          if [[ "$PUBLIC_ALPHA_OUTCOME" != "success" || "$INTERNAL_FETCH_OUTCOME" != "success" ]]; then
            exit 1
          fi
