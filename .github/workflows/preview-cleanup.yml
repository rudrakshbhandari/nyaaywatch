name: Preview Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      PREVIEW_SERVICE_NAME: nyaaywatch-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::723951822728:role/nyaaywatch-github-preview-role

      - name: Delete preview service
        run: |
          chmod +x infra/aws/preview/delete-service.sh
          ./infra/aws/preview/delete-service.sh "$PREVIEW_SERVICE_NAME"

      - name: Mark preview comment closed
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          SERVICE_NAME: ${{ env.PREVIEW_SERVICE_NAME }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- nyaaywatch-preview -->";
            const body = `${marker}
            Preview closed.

            Service: \`${process.env.SERVICE_NAME}\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
