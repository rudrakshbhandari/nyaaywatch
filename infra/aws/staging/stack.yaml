AWSTemplateFormatVersion: "2010-09-09"
Description: NyaayWatch AWS environment stack with ECS Fargate, PostgreSQL RDS, S3 artifacts, and CloudWatch logs.

Parameters:
  ProjectName:
    Type: String
    Default: nyaaywatch
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
  ContainerImage:
    Type: String
    Description: Fully-qualified container image URI in ECR.
  ContainerPort:
    Type: Number
    Default: 3000
  DesiredCount:
    Type: Number
    Default: 1
  DatabaseName:
    Type: String
    Default: nyaaywatch
  DatabaseUsername:
    Type: String
    Default: nyaaywatch
  DatabasePassword:
    Type: String
    NoEcho: true
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: Allocated storage in GiB for the managed RDS instance. Must be at least the source snapshot size when restoring from a snapshot.
  DatabaseSnapshotIdentifier:
    Type: String
    Default: ""
    Description: Optional RDS DB snapshot identifier to restore the managed database from during isolated environment bootstrap.
  OperatorApiToken:
    Type: String
    Default: ""
    NoEcho: true
  ExistingDatabaseUrlSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN for an already-managed DATABASE_URL secret.
  ExistingOperatorApiTokenSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN for an already-managed operator token secret.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the public HTTPS listener.
  CanonicalHost:
    Type: String
    Default: nyaaywatch.in
    Description: Canonical hostname emitted by the app and used by ALB redirect rules.
  LegacyHosts:
    Type: String
    Default: nyaaywatch.com,www.nyaaywatch.com
    Description: Comma-separated legacy hostnames that the app redirects to CanonicalHost.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address to subscribe to staging alarms.
  PublicBaseUrl:
    Type: String
    Default: ""
    Description: Optional canonical public base URL used for release verification and cache invalidation.
  CloudflareZoneName:
    Type: String
    Default: ""
    Description: Optional Cloudflare zone name used for public cache invalidation.
  CloudflareApiTokenSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing the Cloudflare API token for cache invalidation.
  CloudflareWebAnalyticsToken:
    Type: String
    Default: ""
    Description: Optional Cloudflare Web Analytics site token emitted in public HTML.
  ManageCanonicalRedirectRules:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether this stack should create and manage the .com to .in ALB redirect listener rules.
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Monthly AWS cost budget in USD. Budgets notify AlarmTopic at 80% actual and 100% forecasted.
  AlbAccessLogsEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether the public ALB should write access logs into the retained artifacts bucket.
  PublicIngressWebAclEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to attach the regional public-ingress WAF web ACL to the public ALB.
  PublicIngressRateLimitPerFiveMinutes:
    Type: Number
    Default: 1200
    MinValue: 100
    Description: Maximum requests per five minutes per client IP before the public-ingress WAF returns 429.
  CloudflareIpv4Cidrs:
    Type: CommaDelimitedList
    Default: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
    Description: Cloudflare IPv4 source CIDRs allowed to reach the public ALB when the public-ingress WAF is enabled.
  CloudflareIpv6Cidrs:
    Type: CommaDelimitedList
    Default: "2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
    Description: Cloudflare IPv6 source CIDRs allowed to reach the public ALB when the public-ingress WAF is enabled.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasPublicBaseUrl: !Not [!Equals [!Ref PublicBaseUrl, ""]]
  HasCloudflareZoneName: !Not [!Equals [!Ref CloudflareZoneName, ""]]
  HasCloudflareApiTokenSecretArn: !Not [!Equals [!Ref CloudflareApiTokenSecretArn, ""]]
  HasCloudflareWebAnalyticsToken: !Not [!Equals [!Ref CloudflareWebAnalyticsToken, ""]]
  ShouldManageCanonicalRedirectRules: !Equals [!Ref ManageCanonicalRedirectRules, "true"]
  HasExistingDatabaseUrlSecretArn: !Not [!Equals [!Ref ExistingDatabaseUrlSecretArn, ""]]
  HasExistingOperatorApiTokenSecretArn: !Not [!Equals [!Ref ExistingOperatorApiTokenSecretArn, ""]]
  HasDatabaseSnapshotIdentifier: !Not [!Equals [!Ref DatabaseSnapshotIdentifier, ""]]
  CreateManagedDatabaseUrlSecret: !Equals [!Ref ExistingDatabaseUrlSecretArn, ""]
  CreateManagedOperatorApiTokenSecret: !Equals [!Ref ExistingOperatorApiTokenSecretArn, ""]
  ShouldEnablePublicIngressWebAcl: !Equals [!Ref PublicIngressWebAclEnabled, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ap-south-1]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-a"
      VpcId: !Ref Vpc

  PublicSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ap-south-1]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-b"
      VpcId: !Ref Vpc

  PrivateSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ap-south-1]
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-a"
      VpcId: !Ref Vpc

  PrivateSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ap-south-1]
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-b"
      VpcId: !Ref Vpc

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAz1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAz1

  PublicSubnetAz2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAz2

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvironmentName}-artifacts-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: env
          Value: !Ref EnvironmentName

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAlbAccessLogDeliveryAclCheck
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt ArtifactsBucket.Arn
          - Sid: AllowAlbAccessLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${ArtifactsBucket.Arn}/alb-access-logs/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${EnvironmentName}"
      RetentionInDays: 30

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${EnvironmentName}-alerts"

  AlarmTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Endpoint: !Ref AlarmEmail
      Protocol: email
      TopicArn: !Ref AlarmTopic

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-${EnvironmentName}-monthly-cost"
        BudgetType: COST
        FilterExpression:
          And:
            - Tags:
                Key: project
                Values:
                  - !Ref ProjectName
                MatchOptions:
                  - EQUALS
            - Tags:
                Key: env
                Values:
                  - !Ref EnvironmentName
                MatchOptions:
                  - EQUALS
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      ResourceTags:
        - Key: project
          Value: !Ref ProjectName
        - Key: env
          Value: !Ref EnvironmentName
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlarmTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlarmTopic

  ApplicationErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApplicationLogGroup
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations:
        - MetricName: !Sub "${ProjectName}-${EnvironmentName}-app-errors"
          MetricNamespace: NyaayWatch/Observability
          MetricValue: "1"

  PublicAlphaOpsAlertMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApplicationLogGroup
      FilterPattern: '"NYAAYWATCH_PUBLIC_ALPHA_OPS_ALERT="'
      MetricTransformations:
        - MetricName: !Sub "${ProjectName}-${EnvironmentName}-public-alpha-ops-alerts"
          MetricNamespace: NyaayWatch/Observability
          MetricValue: "1"

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress for the NyaayWatch staging ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App container access for NyaayWatch staging
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access for NyaayWatch staging
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for NyaayWatch staging PostgreSQL
      SubnetIds:
        - !Ref PrivateSubnetAz1
        - !Ref PrivateSubnetAz2

  StagingDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      DBInstanceClass: db.t4g.micro
      DBSnapshotIdentifier: !If [HasDatabaseSnapshotIdentifier, !Ref DatabaseSnapshotIdentifier, !Ref AWS::NoValue]
      DBName: !If [HasDatabaseSnapshotIdentifier, !Ref AWS::NoValue, !Ref DatabaseName]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      Engine: postgres
      EngineVersion: !If [HasDatabaseSnapshotIdentifier, !Ref AWS::NoValue, "16.13"]
      MasterUsername: !If [HasDatabaseSnapshotIdentifier, !Ref AWS::NoValue, !Ref DatabaseUsername]
      MasterUserPassword: !If [HasDatabaseSnapshotIdentifier, !Ref AWS::NoValue, !Ref DatabasePassword]
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: !If [HasDatabaseSnapshotIdentifier, !Ref AWS::NoValue, true]
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateManagedDatabaseUrlSecret
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}/database-url"
      Description: !Sub "DATABASE_URL for ${ProjectName} ${EnvironmentName}"
      SecretString: !Sub "postgresql://${DatabaseUsername}:${DatabasePassword}@${StagingDatabase.Endpoint.Address}:5432/${DatabaseName}?uselibpqcompat=true&sslmode=require"

  OperatorApiTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateManagedOperatorApiTokenSecret
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}/operator-api-token"
      Description: !Sub "Operator API token for ${ProjectName} ${EnvironmentName}"
      SecretString: !Ref OperatorApiToken

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-task-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub "${ProjectName}-${EnvironmentName}-task-execution-secrets"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !If [HasExistingDatabaseUrlSecretArn, !Ref ExistingDatabaseUrlSecretArn, !Ref DatabaseUrlSecret]
                  - !If [HasExistingOperatorApiTokenSecretArn, !Ref ExistingOperatorApiTokenSecretArn, !Ref OperatorApiTokenSecret]
                  - !If [HasCloudflareApiTokenSecretArn, !Ref CloudflareApiTokenSecretArn, !Ref AWS::NoValue]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-${EnvironmentName}-app"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadBucket
                  - s3:HeadObject
                  - s3:CopyObject
                  - s3:CreateBucket
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref AlarmTopic

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${EnvironmentName}"
      Cpu: 512
      Memory: 1024
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: env
          Value: !Ref EnvironmentName
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-${EnvironmentName}"
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: !Sub "${ContainerPort}"
            - Name: AWS_REGION
              Value: ap-south-1
            - Name: S3_BUCKET
              Value: !Ref ArtifactsBucket
            - Name: DEPLOY_ENV
              Value: !Ref EnvironmentName
            - Name: STATE_CODE
              Value: HP
            - Name: CANONICAL_HOST
              Value: !Ref CanonicalHost
            - Name: LEGACY_HOSTS
              Value: !Ref LegacyHosts
            - !If
              - HasPublicBaseUrl
              - Name: PUBLIC_BASE_URL
                Value: !Ref PublicBaseUrl
              - !Ref AWS::NoValue
            - !If
              - HasCloudflareZoneName
              - Name: CLOUDFLARE_ZONE_NAME
                Value: !Ref CloudflareZoneName
              - !Ref AWS::NoValue
            - !If
              - HasCloudflareWebAnalyticsToken
              - Name: CLOUDFLARE_WEB_ANALYTICS_TOKEN
                Value: !Ref CloudflareWebAnalyticsToken
              - !Ref AWS::NoValue
            - Name: AWS_RUM_APP_MONITOR_ID
              Value: !GetAtt RumAppMonitor.Id
            - Name: AWS_RUM_IDENTITY_POOL_ID
              Value: !Ref RumIdentityPool
            - Name: ALARM_TOPIC_ARN
              Value: !Ref AlarmTopic
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !If [HasExistingDatabaseUrlSecretArn, !Ref ExistingDatabaseUrlSecretArn, !Ref DatabaseUrlSecret]
            - Name: OPERATOR_API_TOKEN
              ValueFrom: !If [HasExistingOperatorApiTokenSecretArn, !Ref ExistingOperatorApiTokenSecretArn, !Ref OperatorApiTokenSecret]
            - !If
              - HasCloudflareApiTokenSecretArn
              - Name: CLOUDFLARE_API_TOKEN
                ValueFrom: !Ref CloudflareApiTokenSecretArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: ap-south-1
              awslogs-stream-prefix: ecs

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: ArtifactsBucketPolicy
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}"
      Scheme: internet-facing
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: !Ref AlbAccessLogsEnabled
        - Key: access_logs.s3.bucket
          Value: !Ref ArtifactsBucket
        - Key: access_logs.s3.prefix
          Value: alb-access-logs
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetAz1
        - !Ref PublicSubnetAz2

  PublicIngressWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: ShouldEnablePublicIngressWebAcl
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-public-ingress"
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Description: !Sub "Rate-limit public ${EnvironmentName} ALB traffic before it can exhaust the origin task."
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-${EnvironmentName}-public-ingress"
        SampledRequestsEnabled: true
      Rules:
        - Name: non-cloudflare-origin-block
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            NotStatement:
              Statement:
                OrStatement:
                  Statements:
                    - IPSetReferenceStatement:
                        Arn: !GetAtt PublicIngressCloudflareIpv4IpSet.Arn
                    - IPSetReferenceStatement:
                        Arn: !GetAtt PublicIngressCloudflareIpv6IpSet.Arn
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${EnvironmentName}-non-cloudflare-origin-block"
            SampledRequestsEnabled: true
        - Name: forwarded-client-rate-limit
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              Limit: !Ref PublicIngressRateLimitPerFiveMinutes
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig:
                HeaderName: CF-Connecting-IP
                FallbackBehavior: MATCH
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${EnvironmentName}-forwarded-client-rate-limit"
            SampledRequestsEnabled: true

  PublicIngressCloudflareIpv4IpSet:
    Type: AWS::WAFv2::IPSet
    Condition: ShouldEnablePublicIngressWebAcl
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-cloudflare-ipv4"
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Ref CloudflareIpv4Cidrs

  PublicIngressCloudflareIpv6IpSet:
    Type: AWS::WAFv2::IPSet
    Condition: ShouldEnablePublicIngressWebAcl
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-cloudflare-ipv6"
      Scope: REGIONAL
      IPAddressVersion: IPV6
      Addresses: !Ref CloudflareIpv6Cidrs

  PublicIngressWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: ShouldEnablePublicIngressWebAcl
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt PublicIngressWebAcl.Arn

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}"
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckEnabled: true
      HealthCheckPath: /health
      Matcher:
        HttpCode: 200-399

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  CanonicalHttpRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: ShouldManageCanonicalRedirectRules
    DeletionPolicy: Delete
    Properties:
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: !Ref CanonicalHost
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - nyaaywatch.com
              - www.nyaaywatch.com
      ListenerArn: !Ref Listener
      Priority: 10

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06

  CanonicalHttpsRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: ShouldManageCanonicalRedirectRules
    DeletionPolicy: Delete
    Properties:
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: !Ref CanonicalHost
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - nyaaywatch.com
              - www.nyaaywatch.com
      ListenerArn: !Ref HttpsListener
      Priority: 10

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      EnableECSManagedTags: true
      LaunchType: FARGATE
      PropagateTags: TASK_DEFINITION
      TaskDefinition: !Ref TaskDefinition
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: env
          Value: !Ref EnvironmentName
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref PublicSubnetAz1
            - !Ref PublicSubnetAz2
      LoadBalancers:
        - ContainerName: !Sub "${ProjectName}-${EnvironmentName}"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

  StagingDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${EnvironmentName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "ALB 5XX and target health",
                "view": "timeSeries",
                "region": "ap-south-1",
                "stacked": false,
                "metrics": [
                  [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ],
                  [ ".", "HTTPCode_Target_5XX_Count", ".", "${LoadBalancer.LoadBalancerFullName}", "TargetGroup", "${TargetGroup.TargetGroupFullName}" ],
                  [ ".", "UnHealthyHostCount", ".", "${LoadBalancer.LoadBalancerFullName}", "TargetGroup", "${TargetGroup.TargetGroupFullName}" ],
                  [ ".", "HealthyHostCount", ".", "${LoadBalancer.LoadBalancerFullName}", "TargetGroup", "${TargetGroup.TargetGroupFullName}" ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Latency and app errors",
                "view": "timeSeries",
                "region": "ap-south-1",
                "stacked": false,
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", "TargetGroup", "${TargetGroup.TargetGroupFullName}" ],
                  [ "NyaayWatch/Observability", "${ProjectName}-${EnvironmentName}-app-errors" ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Uptime canary success %",
                "view": "timeSeries",
                "region": "ap-south-1",
                "stacked": false,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "metrics": [
                  [ "CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${UptimeCanary}" ]
                ],
                "annotations": {
                  "horizontal": [
                    { "value": 99, "label": "alarm threshold", "color": "#d62728" }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "ECS task CPU / memory",
                "view": "timeSeries",
                "region": "ap-south-1",
                "stacked": false,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ServiceName", "${Service.Name}", "ClusterName", "${Cluster}", { "stat": "Average", "label": "CPU %" } ],
                  [ ".", "MemoryUtilization", ".", ".", ".", ".", { "stat": "Average", "label": "Memory %" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Public alpha ops monitor alerts",
                "view": "timeSeries",
                "region": "ap-south-1",
                "stacked": false,
                "metrics": [
                  [ "NyaayWatch/Observability", "${ProjectName}-${EnvironmentName}-public-alpha-ops-alerts" ]
                ]
              }
            }
          ]
        }

  HealthEndpointFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-health-endpoint"
      AlarmDescription: !Sub "The ${EnvironmentName} target group is failing the /health check."
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      AlarmActions:
        - !Ref AlarmTopic

  AlbTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-alb-target-5xx"
      AlarmDescription: !Sub "The ${EnvironmentName} load balancer or app target is returning 5xx responses."
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      AlarmActions:
        - !Ref AlarmTopic

  ApplicationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-app-errors"
      AlarmDescription: !Sub "Structured application errors were emitted in ${EnvironmentName}."
      Namespace: NyaayWatch/Observability
      MetricName: !Sub "${ProjectName}-${EnvironmentName}-app-errors"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  PublicAlphaOpsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-public-alpha-ops"
      AlarmDescription: !Sub "The ${EnvironmentName} scheduled public alpha operations monitor detected parity drift, stale snapshots, or internal fetch lag."
      Namespace: NyaayWatch/Observability
      MetricName: !Sub "${ProjectName}-${EnvironmentName}-public-alpha-ops-alerts"
      Statistic: Sum
      # The monitor runs every 30 min and emits this metric only on failure, so each
      # run is a single sparse datapoint. With a 5-min period + notBreaching the alarm
      # dropped back to OK between samples and re-fired (a fresh page) every cycle. A
      # 30-min period aligns one evaluation window to one monitor run, so a sustained
      # failure stays in a single ALARM state (one page) and still clears within a
      # cycle of recovery. Detection latency is unchanged (first failing run alarms).
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  CanaryArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvironmentName}-canary-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-runs
            Status: Enabled
            ExpirationInDays: 31
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: env
          Value: !Ref EnvironmentName

  CanaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-canary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: canary-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                Resource: !Sub "${CanaryArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics

  UptimeCanary:
    Type: AWS::Synthetics::Canary
    DependsOn: HttpsListener
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-up"
      ExecutionRoleArn: !GetAtt CanaryRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-9.1
      ArtifactS3Location: !Sub "s3://${CanaryArtifactsBucket}/"
      StartCanaryAfterCreation: true
      Schedule:
        Expression: "rate(5 minutes)"
        DurationInSeconds: "0"
      RunConfig:
        TimeoutInSeconds: 60
        MemoryInMB: 1024
        EnvironmentVariables:
          SYNTHETICS_BASE_URL: !If [HasPublicBaseUrl, !Ref PublicBaseUrl, !Sub "https://${CanonicalHost}"]
      SuccessRetentionPeriod: 7
      FailureRetentionPeriod: 31
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');

          const run = async function () {
            const baseUrl = process.env.SYNTHETICS_BASE_URL;
            const page = await synthetics.getPage();

            const healthResp = await page.goto(baseUrl + '/health', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            if (!healthResp.ok()) {
              throw new Error('health ' + healthResp.status());
            }

            const homeResp = await page.goto(baseUrl + '/', {
              waitUntil: 'networkidle0',
              timeout: 30000,
            });
            if (!homeResp.ok()) {
              throw new Error('home ' + homeResp.status());
            }
            await synthetics.takeScreenshot('home', 'loaded');
          };

          exports.handler = async () => {
            return await run();
          };

  CanaryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvironmentName}-canary-failures"
      AlarmDescription: !Sub "The ${EnvironmentName} uptime canary has failed 2 consecutive runs."
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 99
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: CanaryName
          Value: !Ref UptimeCanary
      AlarmActions:
        - !Ref AlarmTopic

  RumIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${ProjectName}_${EnvironmentName}_rum"
      AllowUnauthenticatedIdentities: true

  RumUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-rum-unauth"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref RumIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": unauthenticated
      Policies:
        - PolicyName: rum-put-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rum:PutRumEvents
                Resource: !Sub "arn:aws:rum:${AWS::Region}:${AWS::AccountId}:appmonitor/${ProjectName}-${EnvironmentName}"

  RumIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref RumIdentityPool
      Roles:
        unauthenticated: !GetAtt RumUnauthRole.Arn

  RumAppMonitor:
    Type: AWS::RUM::AppMonitor
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}"
      Domain: nyaaywatch.in
      CwLogEnabled: false
      AppMonitorConfiguration:
        IdentityPoolId: !Ref RumIdentityPool
        GuestRoleArn: !GetAtt RumUnauthRole.Arn
        SessionSampleRate: 1
        Telemetries:
          - performance
          - errors
          - http
        AllowCookies: false
        EnableXRay: false

  TopErrorEventsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}/top-error-events-24h"
      LogGroupNames:
        - !Ref ApplicationLogGroup
      QueryString: |
        fields @timestamp, event, @message
        | filter level = "error"
        | stats count() as occurrences by event
        | sort occurrences desc
        | limit 20

  SlowRequestsByPathQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}/slow-requests-p95-by-path"
      LogGroupNames:
        - !Ref ApplicationLogGroup
      QueryString: |
        fields @timestamp, path, durationMs, statusCode
        | filter event = "http_request"
        | stats pct(durationMs, 95) as p95_ms, count() as reqs by path
        | sort p95_ms desc
        | limit 20

Outputs:
  ServiceUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}"
  VpcId:
    Value: !Ref Vpc
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetAz1, !Ref PublicSubnetAz2]]
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetAz1, !Ref PrivateSubnetAz2]]
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  DatabaseEndpoint:
    Value: !GetAtt StagingDatabase.Endpoint.Address
  DatabaseUrlSecretArn:
    Value: !If [HasExistingDatabaseUrlSecretArn, !Ref ExistingDatabaseUrlSecretArn, !Ref DatabaseUrlSecret]
  LogGroupName:
    Value: !Ref ApplicationLogGroup
  ClusterName:
    Value: !Ref Cluster
  OperatorApiTokenSecretArn:
    Value: !If [HasExistingOperatorApiTokenSecretArn, !Ref ExistingOperatorApiTokenSecretArn, !Ref OperatorApiTokenSecret]
  CloudflareApiTokenSecretArn:
    Condition: HasCloudflareApiTokenSecretArn
    Value: !Ref CloudflareApiTokenSecretArn
  CertificateArn:
    Value: !Ref CertificateArn
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  DashboardName:
    Value: !Ref StagingDashboard
  CanaryName:
    Value: !Ref UptimeCanary
  CanaryArtifactsBucketName:
    Value: !Ref CanaryArtifactsBucket
  RumAppMonitorId:
    Value: !GetAtt RumAppMonitor.Id
  RumIdentityPoolId:
    Value: !Ref RumIdentityPool
  PublicIngressWebAclArn:
    Condition: ShouldEnablePublicIngressWebAcl
    Value: !GetAtt PublicIngressWebAcl.Arn
